<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Jun Alvior</title>
    <meta
      name="description"
      content="Oops! The page you were looking for could not be found."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/theme-check.js"></script>
    <link rel="icon" href="assets/logo.png" type="image/png" />
  </head>
  <body
    class="bg-grey-light text-grey-dark dark:bg-[#1a1a1a] dark:text-gray-200 transition-colors duration-300 antialiased font-sans flex flex-col min-h-screen"
  >
    <main class="flex-grow flex items-center justify-center p-6 text-center">
      <div class="space-y-6 max-w-lg">
        <h1 class="text-7xl font-bold text-wood-accent">404</h1>
        <h2 class="text-3xl font-semibold text-gray-900 dark:text-white">
          Page Not Found
        </h2>
        <p class="text-gray-600 dark:text-gray-400 text-lg">
          The page you're looking for doesn't exist or has been moved. Let's get
          you back on track.
        </p>
        <a
          href="index.html"
          class="inline-flex items-center justify-center px-8 py-4 bg-wood-accent hover:bg-wood-700 text-white font-medium rounded-lg shadow-lg hover:shadow-wood-accent/40 transition-all focus-visible:ring-2 focus-visible:ring-wood-accent focus:outline-none focus:ring-2 focus:ring-wood-accent"
        >
          <span class="material-icons-outlined mr-2">home</span>
          Return to Homepage
        </a>
      </div>
    </main>
  </body>
</html>
