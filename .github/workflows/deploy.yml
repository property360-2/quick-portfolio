# Purpose: Defines the GitHub Actions deployment workflow for this Astro portfolio.
# Contains the checkout, Node.js setup, dependency installation, Astro build, and
# GitHub Pages publishing steps that run whenever changes are pushed to the main
# deployment branches.

name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install Dependencies
        run: npm install

      - name: Build Astro App
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
