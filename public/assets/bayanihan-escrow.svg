<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background-color: #121214; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;">
  <!-- Definitions for Markers (Arrowheads) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4a373" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" font-size="18" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Bayanihan: Financial &amp; Escrow Autonomy Architecture (BSP Compliance)</text>

  <!-- Box Left: Bayanihan Platform -->
  <g transform="translate(50, 100)">
    <rect width="260" height="150" rx="8" fill="#1a1a1e" stroke="#2d2d34" stroke-width="2" />
    <rect width="260" height="35" rx="8" fill="#d4a373" fill-opacity="0.1" stroke="none" />
    <text x="130" y="24" font-size="14" font-weight="bold" fill="#d4a373" text-anchor="middle">Bayanihan Platform</text>
    <text x="20" y="65" font-size="12" fill="#e4e4e7">• Matching Information</text>
    <text x="20" y="90" font-size="12" fill="#e4e4e7">• Triggers API Commands</text>
    <text x="20" y="115" font-size="12" fill="#e4e4e7">• Never stores cash</text>
  </g>

  <!-- Right: Payment Gateway -->
  <g transform="translate(550, 100)">
    <rect width="280" height="90" rx="8" fill="#1a1a1e" stroke="#2d2d34" stroke-width="2" />
    <rect width="280" height="35" rx="8" fill="#d4a373" fill-opacity="0.1" stroke="none" />
    <text x="140" y="24" font-size="14" font-weight="bold" fill="#d4a373" text-anchor="middle">Payment Gateway</text>
    <text x="140" y="65" font-size="12" fill="#e4e4e7" text-anchor="middle">(Xendit / Maya Business)</text>
  </g>

  <!-- Right Bottom: Escrow Account -->
  <g transform="translate(550, 290)">
    <rect width="280" height="70" rx="8" fill="#1a1a1e" stroke="#2d2d34" stroke-width="2" />
    <rect width="280" height="35" rx="8" fill="#d4a373" fill-opacity="0.1" stroke="none" />
    <text x="140" y="24" font-size="14" font-weight="bold" fill="#d4a373" text-anchor="middle">Escrow Account</text>
    <text x="140" y="55" font-size="12" fill="#e4e4e7" text-anchor="middle">Holds Project Funds Privately</text>
  </g>

  <!-- Connector: Platform to Gateway (API call) -->
  <path d="M 310 130 L 540 130" fill="none" stroke="#d4a373" stroke-width="2" marker-end="url(#arrow)" />
  <text x="425" y="120" font-size="11" fill="#a1a1aa" text-anchor="middle">API Webhook</text>

  <!-- Connector: Gateway to Platform (Webhook response) -->
  <path d="M 540 170 L 320 170" fill="none" stroke="#d4a373" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <text x="425" y="190" font-size="11" fill="#a1a1aa" text-anchor="middle">Event: payment.locked</text>

  <!-- Connector: Gateway to Escrow -->
  <path d="M 690 190 L 690 280" fill="none" stroke="#d4a373" stroke-width="2" marker-end="url(#arrow)" />
  <text x="705" y="240" font-size="11" fill="#a1a1aa">Holds Funds</text>

  <!-- Lower Section: Lifecycle/Webhook Triggers -->
  <rect x="50" y="380" width="780" height="80" rx="8" fill="#151518" stroke="#25252b" stroke-width="1.5" />
  
  <text x="65" y="410" font-size="12" font-weight="bold" fill="#d4a373">Intake Lock:</text>
  <text x="180" y="410" font-size="12" fill="#e4e4e7">Gateway Trigger ───&gt; Webhook: payment.escrow_locked ───&gt; Platform</text>
  
  <text x="65" y="440" font-size="12" font-weight="bold" fill="#d4a373">Payout Release:</text>
  <text x="180" y="440" font-size="12" fill="#e4e4e7">Platform Trigger ───&gt; API Release ───&gt; Webhook: payment.payout_released ───&gt; Partner</text>
</svg>
